import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.93'
}

tasks.named('wrapper', Wrapper).configure {
    gradleVersion = '8.14.3'
}

archivesBaseName = project.archives_base_name
version = "NeoForge-${minecraft_version}-${mod_version}"
group = project.maven_group

ext {
    versionProperties = ["mod_version": mod_version, "mc_version": minecraft_version_range, "neo_version": neo_version_range, "loader_version": loader_version_range]
    jsonPatterns = ["**/*.json", "**/*.mcmeta"]
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of("${java_version}"))
        vendor.set(JvmVendorSpec.JETBRAINS)
    }
}

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

// Mojang ships Java 17 to end users in 1.20.4, so mods should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

runs {
    configureEach { net.neoforged.gradle.dsl.common.runs.run.Run run ->
        boolean supportsGameTests = !run.isDataGenerator.get()
        if (supportsGameTests) {
            run.systemProperty('neoforge.enabledGameTestNamespaces', 'copperequipment')
        }
        if (run.project.hasProperty('forge_force_ansi')) {
            run.jvmArgument("-Dterminal.ansi=${run.project.property('forge_force_ansi')}")
        }
        run.modSource((SourceSet) sourceSets.main)
        if (run.project.javaToolchains.launcherFor(java.toolchain).map { it.metadata.vendor }.getOrElse("").contains("JetBrains")) {
            run.jvmArgument("-XX:+AllowEnhancedClassRedefinition")
        }
    }
    client {
        if (project.hasProperty('mc_uuid')) {
            programArguments('--uuid', (String) project.property('mc_uuid'))
        }
        if (project.hasProperty('mc_username')) {
            programArguments('--username', (String) project.property('mc_username'))
        }
        if (project.hasProperty('mc_accessToken')) {
            programArguments('--accessToken', (String) project.property('mc_accessToken'))
        }
    }
    server {
    }
    gameTestServer {
    }
    data {
        programArguments('--all', '--output', project.file('src/generated/resources/').getAbsolutePath(),
                '--mod', 'copperequipment', '--existing', project.file('src/main/resources/').getAbsolutePath())
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
}

def replaceResources = tasks.register("replaceResources", Copy) {
    it.outputs.upToDateWhen { false }
    def modsToml = copySpec {
        from(sourceSets.main.resources) {
            include "META-INF/mods.toml"
            expand versionProperties
        }
    }
    it.with modsToml
    it.into layout.buildDirectory.dir('resources/main/')
    //If IntelliJ's output dir exists, copy it there as well
    if (new File("$rootDir/out/production/").exists()) {
        copy {
            with modsToml
            into "$rootDir/out/production/"
        }
    }
    if (new File("$rootDir/bin/main/").exists()) {
        copy {
            with modsToml
            into "$rootDir/bin/main/"
        }
    }
}

processResources {
    duplicatesStrategy(DuplicatesStrategy.FAIL)
    exclude('META-INF/mods.toml')
    configure { finalizedBy(replaceResources) }
    doLast {
        fileTree(dir: getOutputs().getFiles().getAsPath(), includes: jsonPatterns).each {
            File file -> file.setText(JsonOutput.toJson(new JsonSlurper().parse(file)))
        }
    }
}

classes.configure { dependsOn(replaceResources) }

tasks.named('jar', Jar).configure {
    duplicatesStrategy(DuplicatesStrategy.FAIL)
    manifest.attributes([
            'Specification-Title': 'copperequipment',
            'Specification-Vendor': 'copperequipmentsareus',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor': 'copperequipmentsareus',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
    ])
}

publishing {
    publications { PublicationContainer publicationContainer ->
        publicationContainer.register("mavenJava", MavenPublication) { MavenPublication publication ->
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach({
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(["-Xmaxerrs", "100000"])
})

tasks.withType(Javadoc).configureEach({
    options.tags = [
            'apiNote:a:<em>API Note:</em>',
            'implSpec:a:<em>Implementation Requirements:</em>',
            'implNote:a:<em>Implementation Note:</em>'
    ]
})